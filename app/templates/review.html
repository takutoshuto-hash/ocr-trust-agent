<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>確認 {{ fd.form_id }}</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;color:#222}
.wrap{display:grid;grid-template-columns:1fr 1fr;height:100vh}
.img{overflow:auto;background:#f4f4f4;padding:12px}.img img{max-width:100%}
.form{overflow:auto;padding:16px}
.row{display:grid;grid-template-columns:220px 1fr;gap:8px;align-items:center;padding:6px 8px;border-radius:6px}
.row.review{background:#fff3f3;border:2px solid #e33}.row.auto{opacity:.55}
.row.audit{background:#fffbe6;border:2px solid #d9a400}
.row input{width:100%;padding:6px;font-size:15px}
.reason{grid-column:1/3;font-size:12px;color:#a00}
.explain{background:#f7f7ff;border:1px solid #ccd;padding:10px;white-space:pre-wrap;font-size:13px;margin-bottom:12px}
button{font-size:16px;padding:10px 18px}
</style></head><body>
<div class="wrap">
  <div class="img"><img src="/forms/{{ fd.form_id }}/image" alt="原本"></div>
  <div class="form">
    <h2>{{ fd.form_id }} <small>送り主 {{ fd.sender_id }} / 様式 {{ fd.format_id }}</small></h2>
    <div class="explain">{{ explanation }}</div>
    <form method="post" action="/review/{{ fd.form_id }}">
      <p>確認者: <input name="reviewer" value="staff" style="width:120px"></p>
      {% for path, d in fd.decisions.items() %}
      <div class="row {{ 'review' if d.status == FieldStatus.REVIEW else ('audit' if d.audit else 'auto') }}">
        <label>{{ path }}<br><small>L{{ d.level.value }}{% if d.p_correction is not none %} · p={{ '%.3f' % d.p_correction }}{% endif %}</small></label>
        <input name="field:{{ path }}" value="{{ d.value }}" {% if not d.human_sees %}tabindex="-1"{% endif %}>
        {% if d.human_sees %}<div class="reason">{{ d.reasons | join(' / ') }} — 検証: {{ fd.verdicts[path].reason }}</div>{% endif %}
      </div>
      {% endfor %}
      <p><button type="submit">確定して次へ（Enter）</button></p>
    </form>
  </div>
</div>
</body></html>
