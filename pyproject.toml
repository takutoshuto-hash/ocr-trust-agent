[project]
name = "ocr-trust-agent"
version = "0.1.0"
description = "信頼が育つOCR受注エージェント: 抽出 → ジャッジ → 自律レベル判定 → 人の修正を学習"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Takuto Shuto"}]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pillow>=10.3",
    "numpy>=1.26",
    "scikit-learn>=1.7,<1.8",   # 同梱の models/router.joblib は 1.7.1 で学習。別の系列では pickle が読めないことがある
    "joblib>=1.4",
    "google-genai>=1.0",
    "google-adk>=1.0",
    "google-cloud-firestore>=2.16",
    "google-cloud-storage>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
